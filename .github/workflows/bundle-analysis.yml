name: Bundle Analysis

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  bundle-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend with bundle analysis
        run: pnpm build:frontend:analyze
        env:
          CI: true

      - name: Check bundle size limits
        run: pnpm check:bundle
        working-directory: frontend
        continue-on-error: true

      - name: Generate bundle report
        run: pnpm bundle:analyze
        working-directory: frontend
        continue-on-error: true

      - name: Upload bundle reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bundle-reports
          path: |
            frontend/.bundle-reports/
            frontend/.next/static/
          if-no-files-found: ignore

      - name: Comment PR with bundle size
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const reportPath = './frontend/.bundle-reports/bundle-report-*.md';
            const reports = require('glob').sync(reportPath);

            if (reports.length > 0) {
              const report = fs.readFileSync(reports[reports.length - 1], 'utf8');

              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: '## 📦 Bundle Analysis\n\n' + report
              });
            }

name: Staging Deployment

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - "contracts/**"
      - "packages/**"
      - "Dockerfile"
      - "docker-compose.staging.yml"
      - ".github/workflows/staging-deployment.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/staging

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=staging-

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run contract tests
        run: |
          cd contracts/oracle
          cargo test
          cd ../provenance
          cargo test
          cd ../registry
          cargo test

      - name: Build contracts for staging
        run: npm run build:contracts

      - name: Deploy to staging environment
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          STAGING_DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
          STAGING_REDIS_PASSWORD: ${{ secrets.STAGING_REDIS_PASSWORD }}
          STAGING_DEPLOYMENT_URL: ${{ secrets.STAGING_DEPLOYMENT_URL }}
          STAGING_API_KEY: ${{ secrets.STAGING_API_KEY }}
        run: |
          # Deploy staging environment
          echo "Deploying to staging environment..."
          # This would be your actual deployment command
          # For example: ansible-playbook or kubectl apply for your infrastructure

      - name: Run E2E tests on staging
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          NEXT_PUBLIC_STAGING_URL: https://staging.example.com
          NEXT_PUBLIC_MOCK_WALLET: "false"
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter frontend test:e2e

      - name: Upload E2E test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-staging-report
          path: frontend/playwright-report

      - name: Notify deployment status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const status = context.payload.repository.full_name
            const message = `Staging deployment: ${{ job.status }}`
            console.log(message)

  security-scan:
    runs-on: ubuntu-latest
    needs: build-and-deploy

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run security audit
        run: |
          pnpm install --frozen-lockfile
          pnpm audit --audit-level=moderate || true

      - name: SAST scan with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "config"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: "trivy-results.sarif"

  staging-health-check:
    runs-on: ubuntu-latest
    needs: build-and-deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Check staging frontend health
        run: |
          max_attempts=30
          attempt=0
          while [ $attempt -lt $max_attempts ]; do
            if curl -f https://staging.example.com/api/health; then
              echo "Staging frontend is healthy"
              exit 0
            fi
            attempt=$((attempt + 1))
            sleep 10
          done
          echo "Staging frontend failed health check"
          exit 1

      - name: Check staging database connectivity
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          # Check database connectivity
          psql "$DATABASE_URL" -c "SELECT 1;" || exit 1

name: Dependabot Auto-Merge

on:
  pull_request:
    paths:
      - "package.json"
      - "frontend/package.json"
      - "packages/*/package.json"
      - "Cargo.toml"
      - "Dockerfile"
      - ".github/workflows/**"

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'

    permissions:
      pull-requests: write
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Auto-merge minor/patch updates
        if: |
          steps.metadata.outputs.update-type == 'version-update:semver-minor' ||
          steps.metadata.outputs.update-type == 'version-update:semver-patch'
        run: |
          gh pr review ${{ github.event.pull_request.number }} --approve
          gh pr merge ${{ github.event.pull_request.number }} --auto --squash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Request security review for major updates
        if: steps.metadata.outputs.update-type == 'version-update:semver-major'
        run: |
          gh pr comment ${{ github.event.pull_request.number }} \
            --body "⚠️ **Major version update detected** - This PR requires manual review and testing before merging. \n\n**Changes:**\n${{ steps.metadata.outputs.dependency-names }}\n\n**Update type:** ${{ steps.metadata.outputs.update-type }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

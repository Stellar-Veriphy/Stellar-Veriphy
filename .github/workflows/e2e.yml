name: E2E Tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  home-page-e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Build frontend
        run: pnpm --filter frontend build

      - name: Run home page E2E test
        env:
          NEXT_PUBLIC_MOCK_WALLET: "true"
          PLAYWRIGHT_WEB_SERVER_COMMAND: pnpm start
        working-directory: frontend
        run: pnpm test:e2e -- e2e/home.spec.ts --project=chromium

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          if-no-files-found: ignore


  mobile-e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers (chromium + webkit)
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Build frontend
        run: pnpm --filter frontend build

      - name: Run mobile E2E tests (emulated)
        env:
          NEXT_PUBLIC_MOCK_WALLET: "true"
          PLAYWRIGHT_WEB_SERVER_COMMAND: pnpm start
        working-directory: frontend
        run: pnpm test:e2e -- e2e/mobile.spec.ts --project=mobile-chrome --project=mobile-safari --project=breakpoint-xs --project=breakpoint-sm --project=breakpoint-md --project=breakpoint-lg

      - name: Upload mobile Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-mobile
          path: frontend/playwright-report
          if-no-files-found: ignore

  security-e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Build frontend
        run: pnpm --filter frontend build

      - name: Dependency vulnerability scan (npm)
        working-directory: frontend
        run: pnpm audit --audit-level=high || true   # report but don't block

      - name: Run security E2E tests
        env:
          NEXT_PUBLIC_MOCK_WALLET: "true"
          PLAYWRIGHT_WEB_SERVER_COMMAND: pnpm start
        working-directory: frontend
        run: pnpm test:e2e -- e2e/security.spec.ts --project=chromium

      - name: Upload security Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-security
          path: frontend/playwright-report
          if-no-files-found: ignore
